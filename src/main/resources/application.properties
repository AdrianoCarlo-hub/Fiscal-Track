spring.application.name=fiscal-track
server.port=8080

# ============================================================
# Base de donnees PostgreSQL
# Les valeurs sensibles sont externalisees (fichier .env)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiscal_track}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Chargement SQL (schema puis donnees)
# Par defaut Spring Boot n'execute schema.sql/data.sql que sur une base
# embarquee. On force l'execution sur PostgreSQL. Les scripts sont executes
# AVANT l'initialisation JPA (defer-datasource-initialization=false par defaut),
# donc schema.sql cree les tables puis data.sql insere les parametres, et
# Hibernate valide ensuite le mapping (ddl-auto=validate).
# Les INSERT de data.sql utilisent ON CONFLICT (code) DO NOTHING : ils sont
# idempotents et peuvent etre rejoues sans erreur a chaque demarrage.
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ============================================================
# JWT
# La cle JWT_SECRET doit contenir au moins 32 caracteres (256 bits),
# sinon le demarrage est refuse (voir JwtService).
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# CORS
# Origines autorisees (liste separee par des virgules).
# Par defaut : ports de developpement Vite/CRA. En production, definir
# CORS_ALLOWED_ORIGINS avec le domaine reel.
# ============================================================
fiscaltrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ============================================================
# Mail (notifications) - SMTP
# Si MAIL_HOST est vide, l'envoi email retombe sur le log (repli).
# SMS : hors perimetre. PORTAIL : disponible en interne.
# ============================================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
fiscaltrack.mail.expediteur=${MAIL_EXPEDITEUR:no-reply@fiscaltrack.mg}

# ============================================================
# Swagger
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ============================================================
# Logs
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.mg.dgi.fiscaltrack=DEBUG
